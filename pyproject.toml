[project]
name = "blakkisvuohi"
version = "5.0.0"
description = "A Telegram bot that helps to track estimated blood alcohol concentration"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Joonas Ulmanen" }]
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiosqlite>=0.20",
  "cryptography>=43",
  "matplotlib>=3.9",
  "pydantic-settings>=2.4",
  "tzdata",
]

[project.scripts]
blakkisvuohi = "blakkisvuohi.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blakkisvuohi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
